name: Database and Application Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Verify Supabase CLI version
        run: supabase --version

      - name: Rebuild database from migrations
        run: supabase start

      - name: Run database RLS tests
        run: supabase test db supabase/tests/database

      - name: Lint database
        run: supabase db lint --local --schema public,private --fail-on error

      - name: Run application tests
        run: npm run test:ci

      - name: Lint application
        run: npm run lint

      - name: Type-check application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
