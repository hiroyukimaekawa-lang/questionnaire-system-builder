name: Score gating check

on:
  push:
    branches:
      - fix/google-review-score-gating

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: node --import tsx --test tests/google-review.test.ts tests/completion-validation.test.ts tests/config.test.ts tests/survey.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
